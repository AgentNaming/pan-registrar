name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$crate" ] || { echo "tag v$tag does not match Cargo.toml's $crate"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pan-registrar" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version
        run: |
          if docker manifest inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} already exists"; exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        run: |
          set -euo pipefail
          img="${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          docker build -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "$img" .
          docker push "$img"
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\nImage: `%s:%s`\n' "${{ steps.version.outputs.image }}" "$v" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "pan-registrar $v" --notes-file notes.md
